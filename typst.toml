[package]
name = "ece-reports"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["léon <@leonpwd>"]
license = "MIT"
description = "Unofficial Typst templates for ECE (École Centrale d'Électronique) lab and project reports."
repository = "https://github.com/leonpwd/ece-reports"
keywords = ["ece", "ecole-centrale-d-electronique", "ece-paris", "report", "lab-report", "project-report", "engineering"]
categories = ["report"]
disciplines = ["engineering", "computer-science"]
compiler = "0.12.0"
exclude = [
  ".git",
  ".github",
  "*.pdf",
  "assets/preview-*.png",
  "docs",
  "examples",
  "justfile",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
